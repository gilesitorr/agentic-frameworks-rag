[project]
name = "agentic-frameworks-rag"
version = "0.1.0"
description = "Same RAG, three agent frameworks (smolagents, Pydantic AI, LangGraph)."
requires-python = ">=3.11"

dependencies = [
    # Shared RAG core
    "pymupdf4llm>=2.1",  # PDF -> Markdown, with headings as # lines
    "fastembed>=0.4",
    "chromadb>=0.5",
    # Generation model (OpenAI, the same for every implementation)
    "openai>=1.40",
    # Agent frameworks
    "smolagents>=1.14",
    "langgraph>=0.2",
    "pydantic-ai-slim[openai]>=2.71",
    # Utilities
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rust-just>=1.59.0",  # the just command runner, for the demo recipes
]

[tool.uv]
# The project is scripts run from the repo root (python -m ...),
# not an installable library: uv only manages the environment.
package = false
